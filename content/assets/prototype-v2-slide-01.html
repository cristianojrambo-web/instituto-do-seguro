<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 1080px; height: 1350px;
    font-family: 'Segoe UI', sans-serif;
  }
  .frame {
    position: relative; width: 1080px; height: 1350px;
    box-sizing: border-box; overflow: hidden;
    background: radial-gradient(circle at 15% 10%, #3E6BFF 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, #FF7A59 0%, transparent 40%),
                linear-gradient(160deg, #0B1030 0%, #101A4A 45%, #16256B 100%);
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(62,107,255,0.55) 0%, rgba(62,107,255,0) 70%);
    top: -180px; left: -180px; filter: blur(10px);
  }
  .glow2 {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,122,89,0.35) 0%, rgba(255,122,89,0) 70%);
    bottom: -160px; right: -160px;
  }
  .content { position: relative; padding: 100px 76px; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; }
  .kicker {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.28);
    padding: 14px 28px; border-radius: 100px;
    font-weight: 700; font-size: 26px; letter-spacing: 1px; color: #FFE3D6;
    text-transform: uppercase;
  }
  .kicker .dot { width: 10px; height: 10px; border-radius: 50%; background: #FF7A59; }
  .glass-card {
    margin-top: 56px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 36px;
    padding: 64px 56px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 86px; font-weight: 800; line-height: 1.08; color: #FFFFFF;
    margin: 0; letter-spacing: -1.5px;
  }
  h1 .accent { color: #FF9F7A; }
  .footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    font-size: 26px; color: rgba(255,255,255,0.65); font-weight: 600;
  }
  .footer .brand { display: flex; align-items: center; gap: 14px; }
  .badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 20px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="content">
      <div class="kicker"><span class="dot"></span>Mito ou Verdade</div>
      <div class="glass-card">
        <h1>Seu seguro<br>cobre <span class="accent">enchente?</span></h1>
      </div>
      <div class="footer">
        <div class="brand"><div class="badge">IS</div>Instituto do Seguro</div>
        <span>01/05</span>
      </div>
    </div>
  </div>
</body>
</html>
